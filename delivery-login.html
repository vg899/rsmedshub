<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedsHub - Delivery Partner Portal</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="/src/index.css">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen text-slate-800 font-sans">

  <!-- Main Portal Wrapper -->
  <div class="w-full max-w-md mx-auto p-4 md:p-6">
    <div id="portal-card" class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden transition-all duration-300">
      
      <!-- Top Branding -->
      <div class="px-6 pt-8 pb-4 text-center bg-gradient-to-b from-indigo-50/50 to-white select-none relative">
        <a href="/index.html" class="absolute left-6 top-6 text-slate-400 hover:text-slate-600 transition-colors">
          <i class="fa-solid fa-arrow-left text-lg"></i>
        </a>
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-500 text-white shadow-md shadow-indigo-100 mb-3">
          <i class="fa-solid fa-truck-motorcycle text-2xl"></i>
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 font-sans">Rider <span class="text-indigo-500">Fleet</span></h1>
        <p class="text-xs text-slate-500 mt-1 font-semibold uppercase tracking-wider">Fast-Track Medicine Deliveries & Earn</p>
      </div>

      <!-- Tab Selection -->
      <div class="flex border-b border-slate-100 px-6">
        <button id="tab-login" class="flex-1 py-3 text-xs font-bold border-b-2 border-indigo-500 text-indigo-600 focus:outline-none transition-all uppercase tracking-wider">
          <i class="fa-solid fa-right-to-bracket mr-1.5"></i>Sign In
        </button>
        <button id="tab-register" class="flex-1 py-3 text-xs font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-600 focus:outline-none transition-all uppercase tracking-wider">
          <i class="fa-solid fa-id-card mr-1.5"></i>Apply Fleet
        </button>
      </div>

      <!-- Forms Container -->
      <div class="p-6">
        
        <!-- Loading overlay -->
        <div id="portal-loader" class="hidden flex flex-col items-center justify-center py-12 text-slate-500">
          <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-500 mb-3"></i>
          <span class="text-sm font-medium animate-pulse" id="loader-msg">Verifying fleet credentials...</span>
        </div>

        <!-- LOGIN FORM -->
        <form id="form-login" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Rider Email ID</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                <i class="fa-regular fa-envelope"></i>
              </span>
              <input type="email" id="login-email" required placeholder="rider@example.com" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm transition-all">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                <i class="fa-solid fa-lock"></i>
              </span>
              <input type="password" id="login-password" required placeholder="Enter password" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm transition-all">
            </div>
          </div>

          <button type="submit" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3.5 rounded-xl transition-all shadow-md shadow-indigo-100 flex items-center justify-center gap-2 cursor-pointer mt-2 hover:-translate-y-0.5">
            <span>Rider Sign In</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <!-- REGISTER FORM -->
        <form id="form-register" class="hidden space-y-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Rider Full Name</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                <i class="fa-regular fa-user"></i>
              </span>
              <input type="text" id="reg-name" required placeholder="Enter your full name" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm transition-all">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Email Address</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                <i class="fa-regular fa-envelope"></i>
              </span>
              <input type="email" id="reg-email" required placeholder="rider.email@example.com" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm transition-all">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Mobile Number</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                <i class="fa-solid fa-phone"></i>
              </span>
              <input type="tel" id="reg-mobile" required placeholder="10-digit mobile number" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm transition-all">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                <i class="fa-solid fa-lock"></i>
              </span>
              <input type="password" id="reg-password" required minlength="6" placeholder="Choose secure password" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm transition-all">
            </div>
          </div>

          <!-- GPS Location Block -->
          <div id="gps-prompt-block" class="p-3.5 bg-yellow-50 rounded-xl border border-yellow-100 flex items-start gap-3">
            <i class="fa-solid fa-location-crosshairs text-yellow-500 text-lg mt-0.5"></i>
            <div class="flex-1">
              <h4 class="text-xs font-bold text-yellow-900">Partner Location Required</h4>
              <p class="text-[11px] text-yellow-700 font-medium leading-relaxed mt-0.5">Riders must capture their initial base GPS location to join nearby delivery grids.</p>
              <button type="button" id="btn-capture-gps" class="mt-2 inline-flex items-center gap-1.5 bg-yellow-500 hover:bg-yellow-600 text-white font-bold text-xs px-3 py-1.5 rounded-lg transition-all cursor-pointer">
                <i class="fa-solid fa-location-dot"></i>
                <span id="gps-status-txt">Capture GPS</span>
              </button>
            </div>
          </div>

          <button type="submit" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3.5 rounded-xl transition-all shadow-md shadow-indigo-100 flex items-center justify-center gap-2 cursor-pointer mt-2 hover:-translate-y-0.5">
            <span>Apply to Fleet</span>
            <i class="fa-solid fa-user-plus"></i>
          </button>
        </form>

      </div>
    </div>
  </div>

  <script type="module" src="/src/delivery-login.ts"></script>
</body>
</html>
