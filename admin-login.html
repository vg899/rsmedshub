<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedsHub - Command Operations Login</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="/src/index.css">
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen text-slate-100 font-sans">

  <!-- Main Portal Wrapper -->
  <div class="w-full max-w-md mx-auto p-4 md:p-6">
    <div id="portal-card" class="bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 overflow-hidden transition-all duration-300">
      
      <!-- Top Branding -->
      <div class="px-6 pt-8 pb-6 text-center bg-gradient-to-b from-slate-800/40 to-slate-900 select-none relative">
        <a href="/index.html" class="absolute left-6 top-6 text-slate-500 hover:text-slate-300 transition-colors">
          <i class="fa-solid fa-arrow-left text-lg"></i>
        </a>
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-rose-600 text-white shadow-lg shadow-rose-900/30 mb-3 animate-pulse">
          <i class="fa-solid fa-user-shield text-2xl"></i>
        </div>
        <h1 class="text-2xl font-black tracking-tight text-white font-sans">Operations <span class="text-rose-500">Center</span></h1>
        <p class="text-xs text-slate-400 mt-1 font-semibold uppercase tracking-wider">Secured Administrative Terminal</p>
      </div>

      <!-- Forms Container -->
      <div class="p-6">
        
        <!-- Loading overlay -->
        <div id="portal-loader" class="hidden flex flex-col items-center justify-center py-12 text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-4xl text-rose-500 mb-3"></i>
          <span class="text-sm font-medium animate-pulse" id="loader-msg">Authorizing terminal secure session...</span>
        </div>

        <!-- LOGIN FORM -->
        <form id="form-login" class="space-y-5">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Admin Email</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                <i class="fa-regular fa-envelope"></i>
              </span>
              <input type="email" id="login-email" required placeholder="admin@medshub.com" class="w-full bg-slate-950 text-white pl-10 pr-4 py-3 rounded-xl border border-slate-800 outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 text-sm transition-all placeholder:text-slate-600">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Security Key / Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                <i class="fa-solid fa-key"></i>
              </span>
              <input type="password" id="login-password" required placeholder="Enter password" class="w-full bg-slate-950 text-white pl-10 pr-4 py-3 rounded-xl border border-slate-800 outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 text-sm transition-all placeholder:text-slate-600">
            </div>
          </div>

          <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-rose-950/40 flex items-center justify-center gap-2 cursor-pointer mt-2 hover:-translate-y-0.5">
            <span>Authorize Session</span>
            <i class="fa-solid fa-shield-halved"></i>
          </button>
        </form>

      </div>
    </div>
  </div>

  <script type="module" src="/src/admin-login.ts"></script>
</body>
</html>
